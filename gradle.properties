kotlin.internal.native.enableReleaseBinaryCache=true
kotlin.incremental.native=true

#
#JetBrains
org.jetbrains.compose.experimental.jscanvas.enabled=true
#
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#

